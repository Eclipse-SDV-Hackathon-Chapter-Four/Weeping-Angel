schema_version: 3
component: battery_guardian

# This interface file defines event shapes only. Vocabulary and behavior live
# in the canonical artifacts below and are deliberately not duplicated here.
canonical_artifacts:
  guardian_model: ../config/battery_guardian/guardian_model.yaml
  guardian_detection_vocabulary: ../components/guardien/source/guardian_model.rs
  guardian_diagnostics: ../config/battery_guardian/guardian_diagnostics.json
  fault_injection_model: ../config/battery_guardian/fault_injection_model.yaml

# Raw Guardian detection transition published over uProtocol (ADR-007): the
# raw decision stream carries EVERY internal detection transition, mapped or
# not, published before and independently of the DFM projection. JSON payload
# on //guardian-vss/9000/1/9003 (shared guardian-vss entity 9000, RID 9003);
# run_id comes from the Guardian startup configuration (GUARDIAN_RUN_ID).
guardian_evidence_event:
  uri: //guardian-vss/9000/1/9003
  payload_format: UPAYLOAD_FORMAT_JSON
  required:
    - run_id
    - detection_class # DetectionClass enum, e.g. PHYSICAL_TEMP_RATE
    - level           # DetectionLevel enum, e.g. WARNING
    - stage           # active | cleared (detection state, not fault level)
  optional:
    - signal          # canonical signal of the transition, if one exists
    - evidence        # observed, limit, residual, utilization, interval_ms;
                      # absent fields are omitted from the payload
    - timestamp_ms    # source timestamp of the causing sample (ADR-017);
                      # the field is omitted when no causing sample exists.
                      # STREAM_STALE is anchored to the staleness deadline of
                      # the last sample: last source time plus the receive age
                      # rounded up to evaluation periods (ADR-013), because the
                      # oracle keys staleness to that deadline, not to a sample.

# Fault-level change published by the Guardian over uProtocol (ADR-007).
# Mirrors every Failed/Passed change reported to the DFM; JSON payload on
# topic //guardian/1001/1/8001. fault_id values come from
# guardian_diagnostics.json, detection_class from the DetectionClass enum.
guardian_fault_event:
  uri: //guardian/1001/1/8001
  payload_format: UPAYLOAD_FORMAT_JSON
  required:
    - fault_id
    - detection_class
    - stage            # Failed | Passed
    - baseline         # true only for the startup all-clear baseline
    - sovd_path
    - source           # entity, ecu, domain, sw_component, instance
    - evidence         # empty object for baseline / clears without data
  evidence_optional:
    - signal
    - observed
    - limit
    - residual
    - utilization
    - interval_ms      # source/generation interval Δτ of a temporal check
                       # (stays optional)
  # timestamp_ms is a REQUIRED field of the fault event, not an optional
  # evidence entry: required in FaultEvidence whenever a causing sample
  # exists (ADR-017). Baseline/all-clear events carry no timestamp_ms.
  # STREAM_STALE carries its projected staleness deadline (last source time
  # plus receive age rounded up to evaluation periods, ADR-013).
  evidence_timestamp_required:
    - timestamp_ms     # source-relative timestamp of the causing sample

# Authoritative injection-side record emitted by the campaign/Fault Generator.
# injected_class and mutations are copied from the executed injection instance
# in fault_injection_model.yaml; they are never inferred by the Guardian.
campaign_ground_truth_event:
  required:
    - run_id
    - injection_id
    - injected_class
    - started_at
  timing:
    require_one_of:
      - finished_at
      - duration_ms
  signal_faults:
    required:
      - mutations
    mutation_fields:
      - signal
      - operator
      - parameters
