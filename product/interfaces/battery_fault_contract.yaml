schema_version: 3
component: battery_guardian

# This interface file defines event shapes only. Vocabulary and behavior live
# in the canonical artifacts below and are deliberately not duplicated here.
canonical_artifacts:
  guardian_model: ../config/battery_guardian/guardian_model.yaml
  guardian_detection_vocabulary: ../components/guardien/source/guardian_model.rs
  guardian_diagnostics: ../config/battery_guardian/guardian_diagnostics.json
  fault_injection_model: ../config/battery_guardian/fault_injection_model.yaml

# Observation emitted for a Guardian detection state transition. The concrete
# detection_class and detection_level values come from the Guardian enums.
# fault_id is present only when the pair has a configured DFM projection.
guardian_evidence_event:
  required:
    - run_id
    - detection_class
    - detection_level
    - state
    - detected_at_ms
  optional:
    - fault_id
  context:
    - temp_min
    - temp_avg
    - temp_max
    - soc
    - signal
    - observed
    - limit
    - residual
    - utilization

# Fault-level change published by the Guardian over uProtocol (ADR-007).
# Mirrors every Failed/Passed change reported to the DFM; JSON payload on
# topic //guardian/1001/1/8001. fault_id values come from
# guardian_diagnostics.json, detection_class from the DetectionClass enum.
guardian_fault_event:
  uri: //guardian/1001/1/8001
  payload_format: UPAYLOAD_FORMAT_JSON
  required:
    - fault_id
    - detection_class
    - stage            # Failed | Passed
    - baseline         # true only for the startup all-clear baseline
    - sovd_path
    - source           # entity, ecu, domain, sw_component, instance
    - evidence         # empty object for baseline / clears without data
  evidence_optional:
    - signal
    - observed
    - limit
    - residual
    - utilization
    - interval_ms      # source/generation interval Δτ of a temporal check
    - timestamp_ms     # source timestamp of the causing sample (ADR-013)

# Authoritative injection-side record emitted by the campaign/Fault Generator.
# injected_class and mutations are copied from the executed injection instance
# in fault_injection_model.yaml; they are never inferred by the Guardian.
campaign_ground_truth_event:
  required:
    - run_id
    - injection_id
    - injected_class
    - started_at
  timing:
    require_one_of:
      - finished_at
      - duration_ms
  signal_faults:
    required:
      - mutations
    mutation_fields:
      - signal
      - operator
      - parameters
