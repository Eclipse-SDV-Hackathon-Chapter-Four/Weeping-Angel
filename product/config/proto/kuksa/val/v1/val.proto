syntax = "proto3";

package kuksa.val.v1;

import "kuksa/val/v1/types.proto";

service VAL {
    rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
}

// Battery paths (product/config/vss_dbc.json), all under Vehicle.Powertrain.TractionBattery:
//   SourceTimestamp        -> Datapoint.uint32 (CAN TimeStamp, ms; source generation time)
//   Temperature.Average/Max/Min, StateOfCharge.Current -> Datapoint.float
// Datapoint.timestamp is set by feeder/broker, not by the source.
message SubscribeEntry {
    string         path   = 1;
    View           view   = 2;
    repeated Field fields = 3;
}

message SubscribeRequest {
    repeated SubscribeEntry entries = 1;
}

// Each update wraps a DataEntry with the set of changed fields.
message EntryUpdate {
    DataEntry      entry  = 1;
    repeated Field fields = 2;
}

message SubscribeResponse {
    repeated EntryUpdate updates = 1;
}
