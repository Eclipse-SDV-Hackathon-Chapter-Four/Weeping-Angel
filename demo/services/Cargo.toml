[package]
name = "dr-whodunit-services"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "guardian"
path = "src/bin/guardian.rs"

[[bin]]
name = "temp_publisher"
path = "src/bin/temp_publisher.rs"

[[bin]]
name = "vss_bridge"
path = "src/bin/vss_bridge.rs"

[[bin]]
name = "fault_injector"
path = "src/bin/fault_injector.rs"

[dependencies]
tokio        = { version = "1", features = ["full"] }
async-trait  = "0.1"

# DFM fault reporting (Diagnostic Fault Manager via iceoryx2 IPC)
fault_lib = { path = "../fault-lib/src/fault_lib" }
common    = { path = "../fault-lib/src/common" }

# uProtocol over Zenoh
up-rust            = "0.9"
up-transport-zenoh = "0.9"
zenoh              = { version = "1", features = ["unstable"] }

# gRPC — KUKSA Databroker (vss_bridge only)
tonic        = { version = "0.11", features = ["transport"] }
prost        = "0.12"
prost-types  = "0.12"
tokio-stream = "0.1"

axum               = "0.7"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow             = "1"
chrono             = { version = "0.4", features = ["serde"] }
uuid               = { version = "1", features = ["v4", "serde"] }

[build-dependencies]
tonic-build = "0.11"
