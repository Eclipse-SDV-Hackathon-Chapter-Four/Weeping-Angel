<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <style>
      .box  { fill:#ffffff; stroke:#334155; stroke-width:2; rx:10; }
      .prod { fill:#eef2ff; stroke:#4338ca; }
      .guard{ fill:#ecfdf5; stroke:#047857; }
      .diag { fill:#fff7ed; stroke:#c2410c; }
      .test { fill:#fef2f2; stroke:#b91c1c; }
      .title{ font-size:15px; font-weight:700; fill:#0f172a; }
      .sub  { font-size:11px; fill:#475569; }
      .lbl  { font-size:11px; fill:#334155; }
      .edge { stroke:#334155; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .zone { fill:none; stroke:#cbd5e1; stroke-width:1.5; stroke-dasharray:6 4; rx:12; }
      .zlab { font-size:11px; font-weight:700; fill:#94a3b8; }
      .h    { font-size:20px; font-weight:700; fill:#0f172a; }
    </style>
  </defs>

  <text x="30" y="34" class="h">Battery Thermal Guardian — Safety Evidence Factory</text>

  <!-- Test zone -->
  <rect x="20" y="60" width="240" height="470" class="zone"/>
  <text x="34" y="80" class="zlab">TEST / STIMULUS</text>

  <!-- Runtime zone -->
  <rect x="280" y="60" width="420" height="470" class="zone"/>
  <text x="294" y="80" class="zlab">RUNTIME (Rust, local cargo)</text>

  <!-- Diagnostics zone -->
  <rect x="720" y="60" width="220" height="470" class="zone"/>
  <text x="734" y="80" class="zlab">DIAGNOSTICS CLIENT</text>

  <!-- fault_injector -->
  <rect x="40" y="110" width="200" height="76" class="box prod" rx="10"/>
  <text x="60" y="140" class="title">fault_injector</text>
  <text x="60" y="160" class="sub">SCENARIO env var shapes</text>
  <text x="60" y="175" class="sub">battery temp series (JSON)</text>

  <!-- Toxiproxy -->
  <rect x="40" y="300" width="200" height="86" class="box test" rx="10"/>
  <text x="60" y="330" class="title">Toxiproxy</text>
  <text x="60" y="350" class="sub">zenoh proxy 7448 → 7447</text>
  <text x="60" y="365" class="sub">timeout toxic = signal</text>
  <text x="60" y="380" class="sub">delay / dropout</text>

  <!-- Robot -->
  <rect x="40" y="430" width="200" height="86" class="box test" rx="10"/>
  <text x="60" y="460" class="title">Robot Framework</text>
  <text x="60" y="480" class="sub">battery_guardian.robot</text>
  <text x="60" y="495" class="sub">SovdFaultLibrary.py</text>
  <text x="60" y="510" class="sub">drives + asserts + report</text>

  <!-- Guardian -->
  <rect x="300" y="110" width="230" height="110" class="box guard" rx="10"/>
  <text x="320" y="140" class="title">Battery Thermal Guardian</text>
  <text x="320" y="162" class="sub">uProtocol subscriber (up-rust)</text>
  <text x="320" y="178" class="sub">evaluate_faults():</text>
  <text x="320" y="193" class="sub">overtemp · stuck · implausible</text>
  <text x="320" y="208" class="sub">+ staleness watchdog</text>

  <!-- fault_reporter -->
  <rect x="300" y="260" width="230" height="80" class="box guard" rx="10"/>
  <text x="320" y="288" class="title">fault_reporter</text>
  <text x="320" y="308" class="sub">iceoryx2 Reporters (per fault)</text>
  <text x="320" y="323" class="sub">Failed / Passed lifecycle</text>

  <!-- DFM -->
  <rect x="300" y="400" width="230" height="96" class="box diag" rx="10"/>
  <text x="320" y="430" class="title">DFM (dfm_bin)</text>
  <text x="320" y="450" class="sub">Diagnostic Fault Manager</text>
  <text x="320" y="465" class="sub">catalog + KVS storage</text>
  <text x="320" y="480" class="sub">serves dfm/query</text>

  <!-- Catalog -->
  <rect x="560" y="400" width="130" height="96" class="box diag" rx="10"/>
  <text x="576" y="430" class="title">catalog</text>
  <text x="576" y="450" class="sub">battery_</text>
  <text x="576" y="465" class="sub">guardian.json</text>
  <text x="576" y="480" class="sub">5 faults</text>

  <!-- OpenSOVD gateway -->
  <rect x="560" y="150" width="130" height="120" class="box diag" rx="10"/>
  <text x="576" y="180" class="title">OpenSOVD</text>
  <text x="576" y="198" class="title">gateway</text>
  <text x="576" y="220" class="sub">DfmFaultProvider</text>
  <text x="576" y="235" class="sub">app:</text>
  <text x="576" y="250" class="sub">battery_guardian</text>

  <!-- SOVD client (Robot lib) -->
  <rect x="740" y="150" width="180" height="120" class="box diag" rx="10"/>
  <text x="760" y="180" class="title">SOVD HTTP client</text>
  <text x="760" y="202" class="sub">GET /sovd/v1/apps/</text>
  <text x="760" y="217" class="sub">battery_guardian/faults</text>
  <text x="760" y="238" class="sub">DELETE = clear DTCs</text>

  <!-- Report -->
  <rect x="740" y="430" width="180" height="86" class="box" rx="10"/>
  <text x="760" y="460" class="title">Evidence report</text>
  <text x="760" y="480" class="sub">evidence_report.md</text>
  <text x="760" y="495" class="sub">report.html / output.xml</text>

  <!-- Edges -->
  <!-- injector -> guardian (direct) -->
  <path class="edge" d="M240,148 L296,148"/>
  <text x="242" y="140" class="lbl">uProtocol / Zenoh 7447</text>

  <!-- injector -> toxiproxy (stream) -->
  <path class="edge" d="M140,186 L140,300"/>
  <text x="146" y="250" class="lbl">stream</text>

  <!-- toxiproxy -> guardian -->
  <path class="edge" d="M240,330 C270,330 270,175 296,168"/>
  <text x="205" y="292" class="lbl">7448→7447</text>

  <!-- guardian -> fault_reporter -->
  <path class="edge" d="M415,220 L415,258"/>
  <text x="420" y="243" class="lbl">FaultCommand</text>

  <!-- fault_reporter -> DFM -->
  <path class="edge" d="M415,340 L415,398"/>
  <text x="420" y="372" class="lbl">iceoryx2 IPC</text>

  <!-- catalog -> DFM -->
  <path class="edge" d="M560,448 L532,448"/>

  <!-- catalog -> guardian (loaded by reporter) -->
  <path class="edge" d="M625,400 L625,300 L532,300"/>
  <text x="540" y="388" class="lbl">same catalog</text>

  <!-- DFM -> gateway -->
  <path class="edge" d="M532,430 C625,430 625,272 625,272"/>
  <text x="470" y="360" class="lbl">dfm/query</text>

  <!-- gateway -> SOVD client -->
  <path class="edge" d="M690,210 L738,210"/>
  <text x="695" y="202" class="lbl">SOVD</text>

  <!-- Robot -> injector -->
  <path class="edge" d="M140,430 L140,190"/>
  <text x="60" y="240" class="lbl">runs scenario</text>

  <!-- Robot -> toxiproxy (control) -->
  <path class="edge" d="M240,470 C265,470 265,386 244,386"/>
  <text x="150" y="420" class="lbl">toxic API</text>

  <!-- SOVD client -> Robot (results) -->
  <path class="edge" d="M830,270 L830,360 L150,360 L145,428"/>

  <!-- SOVD client -> report -->
  <path class="edge" d="M830,270 L830,428"/>
  <text x="836" y="360" class="lbl">evidence</text>
</svg>
