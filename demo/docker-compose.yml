# =============================================================================
# Doctor Whodunit — SDV Safety Evidence Demo
#
# Two operation modes controlled by Docker Compose profiles:
#
#   docker compose --profile sim up           Zenoh simulator path (default)
#   docker compose --profile can up           Full CAN path (requires ghcr.io)
#   docker compose up                         Core services only
#
# Core services (no profile): zenohd, guardian
# =============================================================================

services:

  # ===========================================================================
  # Zenoh router — uProtocol message bus
  # All uProtocol publishers/subscribers connect here via ZENOH_CONNECT.
  # ===========================================================================
  zenohd:
    image: eclipse/zenoh:latest
    container_name: zenohd
    command: ["-l", "tcp/0.0.0.0:7447"]
    ports:
      - "7447:7447"
    restart: unless-stopped

  # ===========================================================================
  # Battery Thermal Guardian
  # Subscribes to: vss_battery_temp_uri + vss_battery_high_temp_uri
  # Publishes:     vss_guardian_state_uri
  # HTTP:          /health  /state  (port 8080)
  # ===========================================================================
  guardian:
    build:
      context: .
      dockerfile: Containerfile
      args:
        BIN_NAME: guardian
    image: dr-whodunit/guardian:phase3
    container_name: guardian
    environment:
      RUST_LOG: info
      ZENOH_CONNECT: "tcp/zenohd:7447"
      HOST: "0.0.0.0"
      PORT: "8080"
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      zenohd:
        condition: service_started
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fs http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # ─── SIMULATOR PATH (--profile sim) ────────────────────────────────────────
  # Publishes BatteryTempEvent directly over uProtocol/Zenoh.
  # No external images required.
  # ===========================================================================
  temp-publisher:
    profiles: [sim]
    build:
      context: .
      dockerfile: Containerfile
      args:
        BIN_NAME: temp_publisher
    image: dr-whodunit/temp-publisher:phase3
    container_name: temp-publisher
    environment:
      RUST_LOG: info
      ZENOH_CONNECT: "tcp/zenohd:7447"
      PUBLISH_INTERVAL_MS: "500"
      TEMP_START: "32.0"
      TEMP_MAX: "67.0"
      TEMP_RISE_RATE: "0.5"
    restart: unless-stopped
    depends_on:
      - zenohd

  # ===========================================================================
  # ─── FULL CAN PATH (--profile can) ─────────────────────────────────────────
  # No vcan0 or kernel module needed.
  # kuksa-can-provider reads battery_temp.candump directly via --dumpfile.
  #
  # Flow: battery_temp.candump → kuksa-can-provider → kuksa-databroker
  #       → (uProtocol bridge TBD) → guardian
  # ===========================================================================

  kuksa-databroker:
    profiles: [can]
    image: ghcr.io/eclipse-kuksa/kuksa-databroker:main
    container_name: kuksa-databroker
    command: ["--insecure"]
    ports:
      - "55555:55555"
    restart: unless-stopped

  kuksa-can-provider:
    profiles: [can]
    image: ghcr.io/eclipse-kuksa/kuksa-can-provider/can-provider:main
    container_name: kuksa-can-provider
    environment:
      KUKSA_ADDRESS: "kuksa-databroker"
      KUKSA_PORT: "55555"
      DBC_FILE: "/can/battery_temp.dbc"
      MAPPING_FILE: "/can/vss_dbc.json"
      CANDUMP_FILE: "/can/battery_temp.asc"
    command: ["--dumpfile", "/can/battery_temp.asc", "--infinite"]
    volumes:
      - ./can:/can:ro
    restart: unless-stopped
    depends_on:
      - kuksa-databroker

  # VSS Bridge — subscribes to kuksa-databroker via gRPC, publishes BatteryTempEvent
  # over uProtocol/Zenoh so guardian receives the same message format as the sim path.
  vss-bridge:
    profiles: [can]
    build:
      context: .
      dockerfile: Containerfile
      args:
        BIN_NAME: vss_bridge
    image: dr-whodunit/vss-bridge:latest
    container_name: vss-bridge
    environment:
      RUST_LOG: info
      ZENOH_CONNECT: "tcp/zenohd:7447"
      DATABROKER_ADDR: "http://kuksa-databroker:55555"
    restart: unless-stopped
    depends_on:
      - kuksa-databroker
      - zenohd

