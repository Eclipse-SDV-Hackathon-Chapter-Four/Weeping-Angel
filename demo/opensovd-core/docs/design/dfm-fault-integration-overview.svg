<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title description">
  <title id="title">OpenSOVD DFM fault integration overview</title>
  <desc id="description">A SOVD client communicates with the OpenSOVD gateway and server. Fault routes use an entity-specific fault provider, implemented by a DFM adapter that queries fault-lib over iceoryx2.</desc>
  <style>
    .title { font: 700 34px sans-serif; fill: #172033; }
    .subtitle { font: 400 17px sans-serif; fill: #506176; }
    .group { fill: #f7f9fc; stroke: #b8c3d2; stroke-width: 2; }
    .group-title { font: 700 20px sans-serif; fill: #27364e; }
    .box { fill: #ffffff; stroke: #5073a6; stroke-width: 2; }
    .box-core { fill: #eef7f1; stroke: #438967; stroke-width: 2; }
    .box-adapter { fill: #fff4e8; stroke: #c9782d; stroke-width: 2; }
    .box-dfm { fill: #f5effa; stroke: #8762a9; stroke-width: 2; }
    .box-client { fill: #eaf3fb; stroke: #3d7cb5; stroke-width: 2; }
    .heading { font: 700 18px sans-serif; fill: #172033; }
    .body { font: 400 15px sans-serif; fill: #3d4b60; }
    .small { font: 400 13px sans-serif; fill: #3d4b60; }
    .arrow { fill: none; stroke: #304966; stroke-width: 3; marker-end: url(#arrow); }
    .arrow-ipc { fill: none; stroke: #c9782d; stroke-width: 3; stroke-dasharray: 10 7; marker-end: url(#arrow-orange); }
    .label { font: 600 14px sans-serif; fill: #304966; }
    .note { fill: #fffbe7; stroke: #c8ae44; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#304966"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#c9782d"/></marker>
  </defs>

  <rect width="1600" height="940" fill="#ffffff"/>
  <text x="70" y="65" class="title">OpenSOVD - DFM Fault Integration</text>
  <text x="70" y="95" class="subtitle">Transport-neutral Core contract, HTTP SOVD routes, and optional fault-lib / iceoryx2 adapter</text>

  <rect x="55" y="145" width="230" height="210" rx="8" class="group"/>
  <text x="80" y="180" class="group-title">External client</text>
  <rect x="82" y="205" width="176" height="105" rx="6" class="box-client"/>
  <text x="105" y="240" class="heading">SOVD client</text>
  <text x="105" y="268" class="body">GET faults</text>
  <text x="105" y="291" class="body">DELETE faults</text>

  <rect x="340" y="125" width="420" height="415" rx="8" class="group"/>
  <text x="365" y="160" class="group-title">opensovd-gateway / opensovd-server</text>
  <rect x="370" y="185" width="355" height="94" rx="6" class="box"/>
  <text x="392" y="219" class="heading">Gateway startup</text>
  <text x="392" y="245" class="body">--features fault-lib</text>
  <text x="392" y="267" class="body">--dfm-fault-component / --dfm-fault-app</text>
  <rect x="370" y="330" width="355" height="160" rx="6" class="box"/>
  <text x="392" y="364" class="heading">SOVD HTTP fault routes</text>
  <text x="392" y="391" class="small">/v1/components/{id}/faults</text>
  <text x="392" y="414" class="small">/v1/apps/{id}/faults</text>
  <text x="392" y="448" class="body">GET list / item</text>
  <text x="392" y="471" class="body">DELETE all / item</text>

  <rect x="820" y="125" width="390" height="415" rx="8" class="group"/>
  <text x="845" y="160" class="group-title">opensovd-core</text>
  <rect x="850" y="185" width="325" height="112" rx="6" class="box-core"/>
  <text x="873" y="220" class="heading">Topology entity</text>
  <text x="873" y="247" class="body">App or Component</text>
  <text x="873" y="271" class="body">fault_provider: Option&lt;...&gt;</text>
  <rect x="850" y="345" width="325" height="145" rx="6" class="box-core"/>
  <text x="873" y="380" class="heading">FaultProvider trait</text>
  <text x="873" y="407" class="body">list / get</text>
  <text x="873" y="430" class="body">clear_all / clear</text>
  <text x="873" y="462" class="small">Fault, FaultStatus, FaultError</text>

  <rect x="1270" y="125" width="280" height="415" rx="8" class="group"/>
  <text x="1295" y="160" class="group-title">DFM bridge</text>
  <rect x="1300" y="185" width="220" height="125" rx="6" class="box-adapter"/>
  <text x="1321" y="220" class="heading">DfmFaultProvider</text>
  <text x="1321" y="247" class="body">DFM -&gt; Core mapping</text>
  <text x="1321" y="271" class="body">spawn_blocking</text>
  <text x="1321" y="294" class="small">sync IPC outside async handler</text>
  <rect x="1300" y="365" width="220" height="100" rx="6" class="box-adapter"/>
  <text x="1321" y="400" class="heading">Iceoryx2DfmQuery</text>
  <text x="1321" y="427" class="body">DfmQueryApi client</text>

  <rect x="305" y="650" width="990" height="215" rx="8" class="group"/>
  <text x="330" y="685" class="group-title">fault-lib PR #7 process</text>
  <rect x="345" y="715" width="225" height="105" rx="6" class="box-dfm"/>
  <text x="370" y="750" class="heading">iceoryx2 dfm/query</text>
  <text x="370" y="777" class="body">request-response IPC</text>
  <rect x="695" y="715" width="225" height="105" rx="6" class="box-dfm"/>
  <text x="740" y="750" class="heading">dfm_lib / DFM</text>
  <text x="740" y="777" class="body">SovdFaultManager</text>
  <rect x="1045" y="715" width="215" height="105" rx="6" class="box-dfm"/>
  <text x="1070" y="750" class="heading">Fault state</text>
  <text x="1070" y="777" class="body">catalog + storage</text>

  <path d="M258 258 H370" class="arrow"/>
  <text x="287" y="238" class="label">HTTPS</text>
  <path d="M547 279 V330" class="arrow"/>
  <text x="563" y="313" class="label">route</text>
  <path d="M725 410 H850" class="arrow"/>
  <text x="756" y="390" class="label">resolve entity</text>
  <path d="M1012 297 V345" class="arrow"/>
  <text x="1028" y="329" class="label">provider</text>
  <path d="M1175 417 H1300" class="arrow"/>
  <text x="1200" y="398" class="label">delegate</text>
  <path d="M1410 310 V365" class="arrow"/>
  <text x="1426" y="345" class="label">query</text>
  <path d="M1410 465 V600 H458 V715" class="arrow-ipc"/>
  <text x="995" y="580" class="label">iceoryx2 IPC</text>
  <path d="M570 767 H695" class="arrow"/>
  <path d="M920 767 H1045" class="arrow"/>

  <rect x="70" y="585" width="190" height="210" rx="6" class="note"/>
  <text x="92" y="620" class="heading">Visibility rule</text>
  <text x="92" y="651" class="body">A `faults` link is</text>
  <text x="92" y="674" class="body">published only when</text>
  <text x="92" y="697" class="body">that entity has an</text>
  <text x="92" y="720" class="body">attached provider.</text>
  <text x="92" y="754" class="small">No provider -&gt; HTTP 404</text>
</svg>